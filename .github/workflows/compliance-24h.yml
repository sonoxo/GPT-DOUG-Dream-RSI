name: Sonoxo 24H Compliance Watch

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-source-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run authoritative compliance watch
        run: python scripts/compliance_watch.py

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-watch-evidence
          path: artifacts/compliance-watch.json
          if-no-files-found: error
          retention-days: 90
